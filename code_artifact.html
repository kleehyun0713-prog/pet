<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나랑 딱 맞는 은퇴견 짝꿍 찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden relative min-h-[580px] flex flex-col justify-between p-6 sm:p-8">
        
        <!-- 1. 시작 화면 -->
        <section id="screen-start" class="flex-1 flex flex-col justify-between animate-fade-in">
            <div class="text-center my-auto py-8">
                <div class="text-6xl mb-4 animate-bounce">🐶</div>
                <span class="inline-block px-3 py-1 bg-amber-50 text-amber-700 font-semibold text-xs rounded-full mb-3 border border-amber-200">농림축산검역본부 은퇴 봉사견</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight leading-tight mb-3">
                    나랑 딱 맞는<br><span class="text-amber-600">은퇴견 짝꿍</span> 찾기
                </h1>
                <p class="text-slate-500 text-sm sm:text-base leading-relaxed max-w-xs mx-auto mb-6">
                    국가를 위해 헌신한 은퇴견 친구들 중<br>나의 라이프스타일과 가장 잘 어울리는 짝꿍을 찾아보세요!
                </p>
                <div class="inline-flex items-center justify-center px-4 py-2 bg-slate-100 rounded-2xl text-slate-700 font-medium text-sm">
                    🏠 따뜻한 가족을 기다리는 친구 <span id="dog-count-badge" class="ml-1.5 font-extrabold text-amber-600">0</span>마리
                </div>
            </div>
            <button onclick="startQuiz()" class="w-full py-4 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-amber-500/30 transition-all duration-200 flex items-center justify-center gap-2">
                테스트 시작하기 🐾
            </button>
        </section>

        <!-- 2. 질문 화면 -->
        <section id="screen-quiz" class="hidden flex-1 flex-col justify-between animate-fade-in">
            <div>
                <!-- 진행 막대 -->
                <div class="mb-6">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-400 mb-2">
                        <span>진행률</span>
                        <span id="quiz-progress-text" class="text-amber-600">1/5</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                        <div id="quiz-progress-bar" class="bg-amber-500 h-full w-1/5 transition-all duration-300 ease-out"></div>
                    </div>
                </div>

                <!-- 질문 타이틀 -->
                <div class="mb-6">
                    <span id="quiz-step-tag" class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-100">Q1</span>
                    <h2 id="quiz-question" class="text-xl font-bold text-slate-800 mt-2 leading-snug">질문이 여기에 표시됩니다.</h2>
                </div>

                <!-- 보기 버튼 목록 -->
                <div id="quiz-options" class="space-y-3 mb-6">
                    <!-- Dynamic Options -->
                </div>
            </div>

            <!-- 하단 이전 버튼 -->
            <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                <button id="btn-prev" onclick="prevQuestion()" class="px-4 py-2 text-slate-400 hover:text-slate-600 font-semibold text-sm rounded-xl transition-colors disabled:opacity-0" disabled>
                    ← 이전 질문
                </button>
            </div>
        </section>

        <!-- 3. 결과 화면 -->
        <section id="screen-result" class="hidden flex-1 flex-col justify-between animate-fade-in">
            <div class="mb-4">
                <div class="text-center my-4">
                    <span class="text-3xl">🎉</span>
                    <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800 mt-1">당신과 꼭 맞는 짝꿍 은퇴견</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">라이프스타일과 궁합이 가장 높은 TOP 3 친구들이에요!</p>
                </div>

                <!-- 결과 카드 리스트 -->
                <div id="result-cards" class="space-y-4 my-4 max-h-[460px] overflow-y-auto pr-1">
                    <!-- Dynamic Result Cards -->
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <p class="text-center text-[11px] text-slate-400 leading-tight">
                    * 이 결과는 재미로 보는 참고용이에요. 실제 입양은 기관의 심사를 거쳐 결정됩니다.
                </p>
                <button onclick="restartQuiz()" class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 active:bg-black text-white font-bold text-base rounded-2xl transition-all duration-200">
                    다시 하기 🔄
                </button>
            </div>
        </section>

    </main>

                prevBtn.classList.add('opacity-0');
            }
        }

        // 옵션 선택시
        function selectOption(val) {
            userAnswers[currentQuestionIndex] = val;
            if (currentQuestionIndex < QUESTIONS.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        // 이전 질문
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        // 재시작
        function restartQuiz() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('flex');
            document.getElementById('screen-start').classList.remove('hidden');
            document.getElementById('screen-start').classList.add('flex');
        }

        // 강아지 성향 및 궁합 계산
        function calculateDogMatch(dog, answers) {
            const baseStats = BREED_STATS[dog.품종] || BREED_STATS["기타"];
            let activity = baseStats[0];
            const noviceFriendly = baseStats[1];
            const animalFriendly = baseStats[2];

            const intro = dog.소개 || "";
            const tags = [];
            let warningText = "";

            // 활동량 보정 및 태그
            if (/활발|에너지|뛰어/.test(intro)) {
                activity += 1;
                tags.push("🏃 에너지 뿜뿜");
            }
            if (/차분|조용|온순|순한/.test(intro)) {
                activity -= 1;
                tags.push("🛋️ 차분한 편");
            }
            
            // 활동량 1~5 제한
            activity = Math.max(1, Math.min(5, activity));

            if (/애교|안기|배를/.test(intro)) {
                tags.push("💕 애교쟁이");
            }
            if (/겁|낯|소심/.test(intro)) {
                warningText = "💡 새 환경에 천천히 적응해요";
            }

            // 점수 계산
            let score = 100;
            const reasons = [];

            // 1. 산책 점수
            const walkAns = answers[0];
            const walkDiff = Math.abs(walkAns - activity);
            score -= (walkDiff * 10);
            if (walkDiff === 0) {
                reasons.push("원하시는 산책 시간과 운동량이 기가 막히게 딱 맞아요!");
            } else if (walkDiff <= 1) {
                reasons.push("보호자님의 산책 스타일과 무난하게 어울리는 체력을 가졌어요.");
            }

            // 2. 집 환경 점수
            const homeAns = answers[1];
            if (homeAns === "apartment" && activity === 5) {
                score -= 10;
            } else if (homeAns === "house" && activity >= 4) {
                score += 5;
                reasons.push("마당이 있는 환경이라 이 친구의 활기찬 에너지를 마음껏 발산할 수 있어요.");
            } else if (homeAns === "apartment" && activity <= 3) {
                reasons.push("실내에서도 차분하게 지내기 좋아 아파트 거주 환경에 잘 어울려요.");
            }

            // 3. 다른 반려동물 여부
            const petAns = answers[2];
            if (petAns === "yes") {
                score -= (5 - animalFriendly) * 6;
                if (animalFriendly >= 4) {
                    reasons.push("다른 동물들과 친화력이 뛰어나 기존 반려동물과도 잘 지낼 수 있어요.");
                }
            } else {
                reasons.push("외동으로 사랑을 독차지하며 지내기에 참 좋은 친구예요.");
            }

            // 4. 경험 점수
            const expAns = answers[3];
            const reqExp = 6 - noviceFriendly;
            if (expAns < reqExp) {
                score -= (reqExp - expAns) * 8;
            } else {
                reasons.push("보호자님의 양육 경험 덕분에 더욱 안정감 있게 케어해주실 수 있어요.");
            }

            // 5. 성격 선호 점수
            const prefAns = answers[4];
            if (prefAns === "애교쟁이" && tags.includes("💕 애교쟁이")) {
                score += 10;
                reasons.push("원하시던 대로 애교가 듬뿍 넘치는 귀염둥이에요!");
            } else if (prefAns === "차분한 친구" && tags.includes("🛋️ 차분한 편")) {
                score += 10;
                reasons.push("바라시던 대로 성품이 의젓하고 차분한 매력이 있어요.");
            } else if (prefAns === "놀이 친구" && activity >= 4) {
                score += 10;
                reasons.push("함께 신나게 신체활동과 놀이를 즐길 수 있는 최고의 짝꿍이에요!");
            }

            // 보완 이유가 부족할 경우 추가 기본 이유
            if (reasons.length === 0) {
                reasons.push("전반적인 생활 패턴과 성향 합이 잘 맞는 은퇴견이에요.");
            }

            // 최종 점수 범위 보정 (40 ~ 99)
            const finalScore = Math.max(40, Math.min(99, score));

            return {
                dog,
                score: finalScore,
                tags,
                warningText,
                reasons: reasons.slice(0, 2) // 상위 1~2개 이유
            };
        }

        // 결과 화면 표시
        function showResults() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('flex');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('screen-result').classList.add('flex');

            // 모든 강아지 점수 계산 후 정렬
            const matchResults = DOGS.map(dog => calculateDogMatch(dog, userAnswers));
            matchResults.sort((a, b) => b.score - a.score);

            // TOP 3 추출
            const top3 = matchResults.slice(0, 3);
            const container = document.getElementById('result-cards');
            container.innerHTML = '';

            top3.forEach((res, idx) => {
                const dog = res.dog;
                const emoji = BREED_EMOJI[dog.품종] || "🐶";
                const introText = dog.소개 && dog.소개.trim().length > 0 ? dog.소개 : "아직 소개글이 없어요 ✍️";

                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5 relative transition-all duration-200 hover:border-amber-300 shadow-sm";
                
                // 순위 뱃지 색상
                const rankBadgeClass = idx === 0 ? "bg-amber-500 text-white" : idx === 1 ? "bg-slate-700 text-white" : "bg-slate-400 text-white";

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-white border border-slate-200 flex items-center justify-center text-2xl shadow-sm">
                                ${emoji}
                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded-md ${rankBadgeClass} text-[10px] font-extrabold">TOP ${idx + 1}</span>
                                    <h3 class="font-bold text-lg text-slate-800">${dog.이름}</h3>
                                </div>
                                <p class="text-xs text-slate-500 font-medium">${dog.품종} · ${dog.성별} · ${dog.업무}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 font-medium block">궁합 점수</span>
                            <span class="text-xl font-extrabold text-amber-600">${res.score}<span class="text-xs font-bold">%</span></span>
                        </div>
                    </div>

                    <!-- 태그 & 주의 문구 -->
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        ${res.tags.map(t => `<span class="px-2 py-0.5 bg-white border border-amber-200 text-amber-700 text-xs font-bold rounded-lg">${t}</span>`).join('')}
                        ${res.warningText ? `<span class="px-2 py-0.5 bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold rounded-lg">${res.warningText}</span>` : ''}
                    </div>

                    <!-- 추천 이유 -->
                    <div class="bg-white/80 rounded-xl p-2.5 mb-3 border border-slate-100 text-xs space-y-1">
                        <p class="font-bold text-slate-700 mb-1">💚 이래서 잘 맞아요:</p>
                        ${res.reasons.map(r => `<p class="text-slate-600 leading-snug">· ${r}</p>`).join('')}
                    </div>

                    <!-- 소개글 -->
                    <div class="text-xs text-slate-500 bg-slate-100/70 p-2.5 rounded-xl leading-relaxed">
                        <span class="font-bold text-slate-600 block mb-0.5">📝 소개글</span>
                        <p class="line-clamp-3">${introText}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
